[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-ecosystem-backend"
version = "0.2.0"
description = "Sports Ecosystem & AI Platform - core backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",        # [standard] ships `websockets`, required for /ws endpoints
    "SQLAlchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.0.1,<4.1",             # passlib 1.7.4 is incompatible with bcrypt >= 4.1
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",                    # FastAPI TestClient
    "Faker>=25",                      # scripts/seed.py
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
