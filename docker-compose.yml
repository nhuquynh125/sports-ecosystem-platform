name: sports-ecosystem

services:
  db:
    image: postgres:16-alpine
    container_name: sports_ecosystem_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dotenv}
      POSTGRES_DB: ${POSTGRES_DB:-sports_ecosystem}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sports_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sports_ecosystem_backend
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-sports_ecosystem}
      DB_USERNAME: ${POSTGRES_USER:-sports_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dotenv}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sports_net

volumes:
  postgres_data:
    name: sports_ecosystem_postgres_data

networks:
  sports_net:
    name: sports_ecosystem_net
